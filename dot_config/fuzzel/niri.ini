# Fuzzel for the niri session — Catppuccin Mocha.
# Kept separate from fuzzel.ini (HyDE/hyprland era); niri launches
# fuzzel with --config pointing here.

[main]
font=JetBrainsMono Nerd Font:size=13
dpi-aware=no
prompt="❯   "
icon-theme=Papirus-Dark
terminal=alacritty -e
layer=overlay
lines=8
width=44
horizontal-pad=24
vertical-pad=16
inner-pad=10
line-height=24
exit-on-keyboard-focus-loss=yes

[colors]
background=1e1e2ef0
text=cdd6f4ff
prompt=6c7086ff
placeholder=6c7086ff
input=cdd6f4ff
match=89b4faff
selection=313244ff
selection-text=cdd6f4ff
selection-match=89b4faff
counter=6c7086ff
border=cba6f7dd

[border]
width=2
radius=16
