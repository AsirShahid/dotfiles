# hypridle — idle management for the niri session
# 9 min: dim → 10 min: lock → 11 min: screen off → 30 min: suspend

general {
    # DMS owns the session lock. Do not add a second locker here: hyprlock
    # raced DMS for niri's one ext-session-lock slot and left the screen
    # stuck after unlock (2026-07-25 incident).
    # REQUIRED companion setting: DMS lockBeforeSuspend=true (DMS holds a
    # logind delay-inhibitor until its lock is up, so suspend cannot outrun
    # the lock). Restore with: dms ipc call settings set lockBeforeSuspend true
    lock_cmd = dms ipc call lock lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = niri msg action power-on-monitors
}

# Dim the screen as a warning before locking.
listener {
    timeout = 540
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}

# Auto-suspend DISABLED 2026-07-26: s2idle resumes intermittently die since
# 2026-07-25 midday (two hard power-cuts; zero journal lines after suspend
# entry; kernel/firmware/BIOS/power-source all ruled out, cause open).
# Re-enable once resume is trustworthy. If a wake ever wedges again: do NOT
