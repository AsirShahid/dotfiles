# hyprlock — Catppuccin Mocha (used by the niri session; hypridle runs it
# on idle/lid-close, Super+Alt+L runs it directly via niri-lock)

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Framework fingerprint reader: password field also accepts a finger scan.
auth {
    fingerprint {
        enabled = true
        ready_message = (or scan fingerprint)
        present_message = scanning…
    }
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    brightness = 0.5
    vibrancy = 0.17
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M %p"
    font_family = JetBrainsMono Nerd Font
    font_size = 88
    color = rgb(205, 214, 244)
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_family = JetBrainsMono Nerd Font
    font_size = 19
    color = rgb(166, 173, 200)
    position = 0, 110
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 54
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(203, 166, 247)
    inner_color = rgb(30, 30, 46)
    font_color = rgb(205, 214, 244)
    fade_on_empty = true
    placeholder_text = <span foreground="##6c7086">password…</span>
    check_color = rgb(249, 226, 175)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>wrong ($ATTEMPTS)</i>
    rounding = 14
    position = 0, -80
    halign = center
    valign = center
}
