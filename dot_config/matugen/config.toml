# sidescroll extra matugen targets, merged into DMS's matugen runs.
# If matugen ever lands at 4.x here, add `source_color_index = 1` in the config
# section so the 4.x interactive color picker cannot hang scripted runs.
# CAUTION: DMS (core/internal/matugen/matugen.go buildMergedConfig) finds the
# config section with a plain substring search for the bracketed section name,
# comments included -- never write that bracketed token in a comment above the
# real section header, or the merged temp config gets a duplicate table and
# every matugen run fails with a TOML parse error (hit 2026-07-25, dms v1.5.2).

[config]

# Recolor Papirus-Dark folder icons (user copy in ~/.local/share/icons) to the
# nearest papirus-folders palette color on every wallpaper change.
[templates.papirus-folders]
input_path = '~/.config/matugen/templates/papirus-color'
output_path = '~/.local/state/sidescroll/papirus-current'
colors_to_compare = [
    { name = "black",      color = "#4f4f4f" },
    { name = "blue",       color = "#5294e2" },
    { name = "bluegrey",   color = "#607d8b" },
    { name = "brown",      color = "#ae8e6c" },
    { name = "carmine",    color = "#a30002" },
    { name = "cyan",       color = "#00bcd4" },
    { name = "darkcyan",   color = "#45abb7" },
    { name = "deeporange", color = "#eb6637" },
    { name = "green",      color = "#87b158" },
    { name = "grey",       color = "#8e8e8e" },
    { name = "indigo",     color = "#5c6bc0" },
    { name = "magenta",    color = "#ca71df" },
    { name = "nordic",     color = "#81a1c1" },
    { name = "orange",     color = "#ee923a" },
    { name = "palebrown",  color = "#d1bfae" },
    { name = "paleorange", color = "#eeca8f" },
    { name = "pink",       color = "#f06292" },
    { name = "red",        color = "#e25252" },
    { name = "teal",       color = "#16a085" },
    { name = "violet",     color = "#7e57c2" },
    { name = "white",      color = "#e4e4e4" },
    { name = "yaru",       color = "#676767" },
    { name = "yellow",     color = "#f9bd30" },
]
compare_to = "{{ colors.primary.default.hex }}"
post_hook = 'papirus-folders -C {{ closest_color }} -u --theme Papirus > /dev/null 2>&1 || true'

# btop theme, written as a selectable theme file (btop.conf is not touched;
# pick "matugen" as the color theme inside btop once).
[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
