# ~/.config/distrobox/distrobox.ini — reproducible "Arch" dev box (tracked in chezmoi)
#
# Why this exists: an interrupted `paru -Syu` (e.g. the laptop losing power mid-upgrade)
# can leave the box's package db / shared libs half-written and effectively unbootable.
# pacman is NOT transactional across a hard power cut, so the realistic defense is cheap
# RECOVERY rather than magic prevention: everything the box needs is declared here and in
# arch-provision.sh, so a trashed box becomes a ~2-minute rebuild, not a lost environment.
#
# Normally you never run these by hand — `chezmoi apply` builds/refreshes the box for you.
# Manual rebuild from scratch:
#   distrobox assemble create --file ~/.config/distrobox/distrobox.ini \
#     && distrobox enter Arch -- bash ~/.config/distrobox/arch-provision.sh
# Nuke a corrupted box and rebuild clean:
#   distrobox rm Arch -f && distrobox assemble create --file ~/.config/distrobox/distrobox.ini

[Arch]
image=docker.io/library/archlinux:latest
# Re-pull a fresh base whenever the box is (re)built, so a from-scratch rebuild starts
# from a clean, internally-consistent image instead of resurrecting a stale cached layer.
pull=true
start_now=true
# Minimal bootstrap only; the full package set lives in arch-provision.sh (one source of truth).
additional_packages="base-devel git"
# Root build hook: refresh the keyring first (avoids signature failures on a fresh image),
# then a full upgrade so the freshly-pulled base is coherent before user provisioning runs.
init_hooks="pacman-key --init && pacman-key --populate archlinux && pacman -Sy --noconfirm archlinux-keyring && pacman -Su --noconfirm"
