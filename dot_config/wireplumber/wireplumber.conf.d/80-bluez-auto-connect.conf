# Added 2026-07-29. Fix for OnePlus Buds 4 coming up HFP-only after a reboot.
#
# What happens: on boot the GDM greeter runs its own wireplumber, which
# registers the bluez A2DP media endpoints on the system bus. If the buds
# auto-connect during that window, their A2DP stream endpoints get bound to
# the greeter's registration. When the user session starts, the greeter's
# endpoints are unregistered and bluez drops the A2DP SEPs for the already
# connected device. The user's wireplumber then only sees HFP/HSP, and bluez
# never retries A2DP on its own. Seen in journal 2026-07-29 15:06 boot:
# endpoint owner handoff :1.59 -> :1.122 at 15:06:14 with the buds connected
# since 15:06:06. Any wireplumber restart while a device is connected
# reproduces the same state.
#
# bluez5.auto-connect makes wireplumber call ConnectProfile for the listed
# profiles about 2 seconds after it takes over a device that is connected
# with only some of them (device_timer_event in spa bluez5-dbus.c). That
# redoes AVDTP discovery against the current endpoints and restores A2DP
# without a manual disconnect and reconnect.
#
# Note: this is a per device setting, so it has to go through
# monitor.bluez.rules with update-props. Putting it in
# monitor.bluez.properties does nothing (verified against pipewire 1.6.8
# source, bluez5-device.c impl_init). Upstream default: disabled.

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ hfp_hf hsp_hs a2dp_sink ]
      }
    }
  }
]
